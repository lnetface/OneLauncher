name: Build OneLauncher

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            rid: win-x64
            profile: WindowsAot
          - os: ubuntu-22.04
            platform: Linux
            rid: linux-x64
            profile: LinuxAot
          - os: macos-15
            platform: macOS
            rid: osx-arm64
            profile: MacOSAot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Linux AOT dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Publish Windows AOT
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Publish-WindowsAot.ps1 -PublishProfile WindowsAot

      - name: Publish Linux or macOS AOT
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          dotnet publish OneLauncher.Desktop/OneLauncher.Desktop.csproj
          -p:PublishProfile=${{ matrix.profile }}
          --artifacts-path build/output/${{ matrix.profile }}
          --disable-build-servers

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/releases -Force | Out-Null
          Compress-Archive -Path OneLauncher.Desktop/bin/Release/net10.0/publish/${{ matrix.rid }}/aot/* -DestinationPath build/releases/OneLauncher-${{ matrix.rid }}-AOT.zip

      - name: Package Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/releases
          tar -czf build/releases/OneLauncher-${{ matrix.rid }}-AOT.tar.gz \
            -C OneLauncher.Desktop/bin/Release/net10.0/publish/${{ matrix.rid }}/aot .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OneLauncher-${{ matrix.rid }}-AOT
          path: build/releases/OneLauncher-${{ matrix.rid }}-AOT.*
          if-no-files-found: error
          retention-days: 14
